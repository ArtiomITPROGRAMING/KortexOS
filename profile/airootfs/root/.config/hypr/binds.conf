# ==============================================================================
# KORTEX-OS SYSTEM KEYBINDINGS (binds.conf)
# Visual Keybind Manager targets this configuration file
# Connected via 'source = ~/.config/hypr/binds.conf' in hyprland.conf
# ==============================================================================

$mainMod = SUPER

# Main Start Menu on Single-Tap Supe
bindr = SUPER, SUPER_L, exec, pkill rofi || /usr/local/bin/kortex-menu

# Window Lifecycle & Desktop Management
bind = $mainMod, Q, killactive
bind = ALT, F4, killactive
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, SPACE, togglefloating

# Spotlight (MacBook UX Super + Space) & Launche
bind = $mainMod, SPACE, exec, pkill rofi || /usr/local/bin/kortex-spotlight

# Help HUD / Interactive Guide & Reload
bind = $mainMod, F1, exec, /usr/local/bin/kortex-help-hud
bind = $mainMod SHIFT, R, exec, hyprctl reload

# Core Applications
bind = $mainMod, RETURN, exec, /usr/local/bin/kortex-launch kitty
bind = $mainMod, D, exec, pkill rofi || /usr/local/bin/kortex-menu
bind = $mainMod, B, exec, /usr/local/bin/kortex-launch firefox || /usr/local/bin/kortex-launch chromium || kitty
bind = $mainMod, E, exec, kitty --class kortex-files -e yazi

# Kortex Subsystems
bind = $mainMod, S, exec, /usr/local/bin/kortex-open settings
bind = $mainMod, A, exec, /usr/local/bin/kortex-open ai
bind = $mainMod, P, exec, /usr/local/bin/kortex-open store
bind = $mainMod, N, exec, /usr/local/bin/kortex-open net-guard
bind = $mainMod, L, exec, /usr/local/bin/kortex-open lock
bind = $mainMod, M, exec, /usr/local/bin/kortex-open music
bind = $mainMod, K, exec, /usr/local/bin/kortex-open link
bind = $mainMod, V, exec, /usr/local/bin/kortex-open vault
bind = $mainMod, I, exec, /usr/local/bin/kortex-open install

# Sound & Brightness Controls
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86MonBrightnessUp, exec, brightnessctl set +10%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 10%-

# Screenshots
bind = , PRINT, exec, grim ~/screenshot_$(date +%s).png
bind = $mainMod, PRINT, exec, grim ~/screenshot_$(date +%s).png
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy

# Navigation & Focus (Vim & Arrow keys)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, 
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, 
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Window swapping
bind = $mainMod SHIFT, left, swapwindow, l
bind = $mainMod SHIFT, right, swapwindow, 
bind = $mainMod SHIFT, up, swapwindow, u
bind = $mainMod SHIFT, down, swapwindow, d
bind = $mainMod SHIFT, h, swapwindow, l
bind = $mainMod SHIFT, l, swapwindow, 
bind = $mainMod SHIFT, k, swapwindow, u
bind = $mainMod SHIFT, j, swapwindow, d

# Dedicated Workspaces 1-5
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# Mouse interaction (Move: Super+LMB, Resize: Super+RMB)
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
