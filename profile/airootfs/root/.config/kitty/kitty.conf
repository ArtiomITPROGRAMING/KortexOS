# ==============================================================================
# KORTEX-OS KITTY MASTER CONFIGURATION
# Pure Cyberpunk Monochrome (eDEX-UI Tron Style)
# ==============================================================================

# Fonts
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.0

# Window presentation & Low-Latency Rendering
hide_window_decorations yes
window_padding_width    4
background_opacity      0.95
dynamic_background_opacity yes
confirm_os_window_close 0
enable_audio_bell       no
repaint_delay           6
input_delay             1
sync_to_monitor         yes

# Pure Monochrome Palette
foreground              #ffffff
background              #000000
selection_foreground    #000000
selection_background    #ffffff
cursor                  #ffffff
cursor_text_color       #000000
cursor_shape            block

# Monochrome ANSI Colors (Greys & Whites)
color0   #000000
color8   #444444
color1   #888888
color9   #aaaaaa
color2   #888888
color10  #cccccc
color3   #888888
color11  #aaaaaa
color4   #aaaaaa
color12  #ffffff
color5   #888888
color13  #cccccc
color6   #aaaaaa
color14  #ffffff
color7   #cccccc
color15  #ffffff

# Top Tab Bar (Tron eDEX-UI Style)
tab_bar_min_tabs        2
tab_bar_edge            top
tab_bar_style           separato
tab_separator           "     "
tab_title_template      "   {title}   "
active_tab_title_template " [ {title} ] "
active_tab_foreground   #000000
active_tab_background   #ffffff
active_tab_font_style   bold
inactive_tab_foreground #666666
inactive_tab_background #000000
inactive_tab_font_style normal
tab_bar_background      #000000

# Live Theme Engine Override (Managed by kortex-theme-apply)
include theme.conf
