# ==============================================================================
# KORTEX-OS HYPRLAND MASTER CONFIGURATION (Hyprland 0.57+)
# Modular Cyberpunk Tiling Grid & Classic Desktop Hybrid
# ==============================================================================

# Monitor configuration
monitor = , preferred, auto, 1

# Source theme geometry and keybindings
source = ~/.config/hypr/theme.conf
source = ~/.config/hypr/binds.conf

# Environment variables
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland;xcb
env = GDK_BACKEND,wayland,x11
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = MOZ_ENABLE_WAYLAND,1
env = WLR_NO_HARDWARE_CURSORS,1
env = HYPRLAND_CONFIG,/home/kortex/.config/hypr/hyprland.conf

# Debug Settings: Explicitly disable debug overlay & debug logging
debug {
    overlay = false
    disable_logs = true
}

# Cursor settings (fixes invisible cursor in VirtualBox, QEMU, VMware)
cursor {
    no_hardware_cursors = true
}

# Hyprland 0.57+ ecosystem & nag suppression
ecosystem {
    no_update_news = true
    no_donation_nag = true
}

# General system behavior & splash suppression
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    disable_autoreload = false
}

# Input devices
input {
    kb_layout = us,ru
    kb_options = grp:win_space_toggle
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
    sensitivity = 0
}

# General layout & styling
general {
    gaps_in = $gaps_in
    gaps_out = $gaps_out
    border_size = $border_size
    col.active_border = $col_active
    col.inactive_border = $col_inactive
    layout = dwindle
    resize_on_border = true
}

# Cyberpunk visual decoration
decoration {
    rounding = $rounding
    active_opacity = $active_opacity
    inactive_opacity = 0.90

    blur {
        enabled = true
        size = 4
        passes = 2
        new_optimizations = true
        xray = true
    }

    shadow {
        enabled = true
        range = 14
        render_power = 2
        color = $col_shadow
        color_inactive = rgba(00000000)
    }
}

# Snappy Cyberpunk animations
animations {
    enabled = true
    bezier = cyber, 0.05, 0.9, 0.1, 1.0
    animation = windows, 1, 3, cyber
    animation = windowsOut, 1, 3, cyber, popin 85%
    animation = border, 1, 4, default
    animation = borderangle, 1, 6, default
    animation = fade, 1, 3, cyber
    animation = workspaces, 1, 3, cyber
}

# Dwindle layout settings for Kortex Grid
dwindle {
    pseudotile = true
    preserve_split = true
    force_split = 2
}

# Window rules for Kortex Grid modules (Monochrome eDEX-UI Replica)
windowrulev2 = float, class:^(kortex-pulse)$
windowrulev2 = move 0.5% 4%, class:^(kortex-pulse)$
windowrulev2 = size 19% 95%, class:^(kortex-pulse)$

windowrulev2 = float, class:^(kortex-term)$
windowrulev2 = move 20% 4%, class:^(kortex-term)$
windowrulev2 = size 57% 62%, class:^(kortex-term)$

windowrulev2 = float, class:^(kortex-net)$
windowrulev2 = move 77.5% 4%, class:^(kortex-net)$
windowrulev2 = size 22% 62%, class:^(kortex-net)$

windowrulev2 = float, class:^(kortex-files)$
windowrulev2 = move 20% 67%, class:^(kortex-files)$
windowrulev2 = size 33% 32%, class:^(kortex-files)$

windowrulev2 = float, class:^(kortex-kb)$
windowrulev2 = move 53.5% 67%, class:^(kortex-kb)$
windowrulev2 = size 46% 32%, class:^(kortex-kb)$

# KIS System Dialogs: Installer, Settings, AI, Store, Guard, Vault
windowrulev2 = float, class:^(kortex-install)$
windowrulev2 = move 18% 12%, class:^(kortex-install)$
windowrulev2 = size 64% 76%, class:^(kortex-install)$

windowrulev2 = float, class:^(kortex-settings)$
windowrulev2 = move 18% 12%, class:^(kortex-settings)$
windowrulev2 = size 64% 76%, class:^(kortex-settings)$

windowrulev2 = float, class:^(kortex-setting)$
windowrulev2 = move 18% 12%, class:^(kortex-setting)$
windowrulev2 = size 64% 76%, class:^(kortex-setting)$

windowrulev2 = float, class:^(kortex-ai)$
windowrulev2 = move 18% 12%, class:^(kortex-ai)$
windowrulev2 = size 64% 76%, class:^(kortex-ai)$

windowrulev2 = float, class:^(kortex-store)$
windowrulev2 = move 18% 12%, class:^(kortex-store)$
windowrulev2 = size 64% 76%, class:^(kortex-store)$

windowrulev2 = float, class:^(kortex-net-guard)$
windowrulev2 = move 18% 12%, class:^(kortex-net-guard)$
windowrulev2 = size 64% 76%, class:^(kortex-net-guard)$

windowrulev2 = float, class:^(kortex-link)$
windowrulev2 = move 18% 12%, class:^(kortex-link)$
windowrulev2 = size 64% 76%, class:^(kortex-link)$

windowrulev2 = float, class:^(kortex-vault)$
windowrulev2 = move 18% 12%, class:^(kortex-vault)$
windowrulev2 = size 64% 76%, class:^(kortex-vault)$

windowrulev2 = float, class:^(kortex-tour)$
windowrulev2 = center, class:^(kortex-tour)$
windowrulev2 = size 1000 680, class:^(kortex-tour)$

windowrulev2 = fullscreen, class:^(kortex-lock)$

# Dialog & popup rules
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(imv)$
windowrulev2 = float, class:^(mpv)$
windowrulev2 = center, class:^(imv)$

# Dedicated Workspaces
workspace = 1, name:1:GRID, default:true
workspace = 2, name:2:APPS
workspace = 3, name:3:DEV
workspace = 4, name:4:MEDIA
workspace = 5, name:5:SYS

# Autostart: Wallpaper, Theme, Panel, Auth Agent, Audio FX, Mobile Link and Kortex Grid
exec-once = hyprpaper &
exec-once = waybar
exec-once = /usr/lib/polkit-kde-authentication-agent-1 &
exec-once = /usr/local/bin/kortex-audio-fx &
exec-once = /usr/local/bin/kortex-link-daemon &
exec-once = /usr/local/bin/kortex-theme-apply &
exec-once = [ ! -f ~/.config/kortex/.setup_done ] && kitty --class kortex-oobe --title "KORTEX-OS SETUP" -e /usr/local/bin/kortex-oobe &
exec-once = [ ! -f ~/.config/kortex/.tour_done ] && kitty --class kortex-tour --title "KORTEX-OS SYSTEM GUIDE" -e /usr/local/bin/kortex-tour &
exec-once = sleep 0.5 && /usr/local/bin/kortex-grid-init
