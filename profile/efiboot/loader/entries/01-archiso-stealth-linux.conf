title    KortexOS [RAM-Only Stealth Mode] (%ARCH%, UEFI)
sort-key 02
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=y quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0 udev.log_priority=3 %KERNEL_PARAMS%
