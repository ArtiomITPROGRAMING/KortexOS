LABEL kortex
TEXT HELP
Boot KortexOS on BIOS.
Modular cyberpunk Linux distribution.
ENDTEXT
MENU LABEL KortexOS (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0 udev.log_priority=3 %KERNEL_PARAMS%

LABEL kortexstealth
TEXT HELP
Boot KortexOS entirely into RAM (Stealth Mode).
Medium can be removed after boot.
ENDTEXT
MENU LABEL KortexOS [RAM-Only Stealth Mode] (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=y quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0 udev.log_priority=3 %KERNEL_PARAMS%

# Accessibility boot option
LABEL kortexspeech
TEXT HELP
Boot KortexOS on BIOS with speakup screen reader.
ENDTEXT
MENU LABEL KortexOS (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on %KERNEL_PARAMS%
